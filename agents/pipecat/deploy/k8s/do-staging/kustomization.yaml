# DigitalOcean staging deploy target for the SIP gateway.
#
# = sipbridge gateway (default, TLS-only) + DigitalOcean LB settings (TCP mode) +
# a stable load-balancer name so the DO-assigned IP persists (see below).
#
# Images default to :next (staging) from the base — no env-production component.
#
#     kubectl apply -k do-staging
#
# Stable IP: DO can't pin a reserved IP to a managed LB, so we pin the LB *name*
# (do-loadbalancer-name) instead. A fixed name means the CCM always reconciles the
# same LB, so its DO-assigned IP stays put for the LB's lifetime. After the first
# apply, read the IP and wire DNS/SBC to it — then never delete the Service:
#
#     kubectl get svc pipecat-sip -n pipecat -o wide   # EXTERNAL-IP = the stable IP
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../overlays/sipbridge

components:
  - ../components/cloud-digitalocean
  - ../components/webrtc-do        # adds 443 -> :8082 (WebRTC) on the SAME LB

patches:
  - target:
      kind: Service
      name: pipecat-sip
    patch: |-
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1do-loadbalancer-name
        value: pipecat-sip-staging
      # WebRTC TLS — DO-managed Let's Encrypt cert for staging.pipecat.aplisay.net
      # (pipecat.aplisay.net is delegated to DO, so DO issues + auto-renews it):
      #   doctl compute certificate create --type lets_encrypt \
      #     --name pipecat-staging --dns-names staging.pipecat.aplisay.net
      # Paste its ID below. MUST be a real cert ID before `kubectl apply` — a
      # placeholder makes the DO LB reject the 443 listener. (Remove this op + the
      # webrtc-do component to deploy SIP-only.)
      #
      # GOTCHA: DO mints a NEW certificate ID on every Let's Encrypt auto-renewal
      # (~90 days). The CCM keeps the LIVE Service annotation current, but this
      # pinned copy goes stale — and the DO admission webhook then rejects the
      # whole apply (even --dry-run=server) with "certificate not found". Before
      # applying, refresh the value from the live object:
      #   kubectl -n pipecat get svc pipecat-sip -o jsonpath=\
      #     '{.metadata.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-certificate-id}'
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1do-loadbalancer-certificate-id
        value: 4ca3a6bb-3516-4b7c-901d-7648c42916c3
