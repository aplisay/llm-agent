# TEMPLATE — the single-secret alternative to pipecat-secrets.
#
# Instead of spelling out every token/key in pipecat-secrets, you can deliver
# them all as one encrypted SECRETENV_BUNDLE + SECRETENV_KEY pair. Each container
# decrypts it into its own environment at startup — the worker (Python) and
# sipbridge (Go) natively, esl-poller via its dotenv hook, and FreeSWITCH /
# voiceblender via the secretenv-exec wrapper. Nothing is written to disk.
#
# Build a bundle from a .env file (see github.com/rjp44/secretenv):
#
#   export SECRETENV_KEY=$(openssl rand -base64 36)
#   # .env contains every secret: PIPECAT_DISPATCH_TOKEN, SHARED_API_TOKEN,
#   # PIPECAT_SIP_PASSWORD, OPENAI_API_KEY, ESL_SECRET, VOICEBLENDER_API_KEY, ...
#   export $(npx secretenv -e)              # prints SECRETENV_BUNDLE=...
#   kubectl create secret generic pipecat-secretenv -n pipecat \
#       --from-literal=SECRETENV_KEY="$SECRETENV_KEY" \
#       --from-literal=SECRETENV_BUNDLE="$SECRETENV_BUNDLE"
#
# For defence in depth, store SECRETENV_KEY and SECRETENV_BUNDLE in separate
# backends (e.g. key in one secret manager, bundle in another) — an attacker
# needs both to rehydrate the environment.
#
# You can use BOTH this and pipecat-secrets: decrypted bundle values override
# the plain Secret. Do NOT put per-node values (EXT_IP / SIP signalling IP) in
# the bundle — those are detected per node.
#
# Not listed in base/kustomization.yaml; create it out-of-band like the others.
apiVersion: v1
kind: Secret
metadata:
  name: pipecat-secretenv
  namespace: pipecat
  labels:
    app.kubernetes.io/name: pipecat-agent
type: Opaque
stringData:
  SECRETENV_KEY: "REPLACE_WITH_openssl_rand_base64_36"
  SECRETENV_BUNDLE: "REPLACE_WITH_output_of_npx_secretenv_-e"
