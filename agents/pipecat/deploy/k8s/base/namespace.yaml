apiVersion: v1
kind: Namespace
metadata:
  name: pipecat
  labels:
    app.kubernetes.io/name: pipecat-agent
    app.kubernetes.io/part-of: aplisay
    # The SIP node pods use hostNetwork, which the baseline/restricted Pod
    # Security Standards forbid. This namespace must run at the privileged
    # level. Keep all SIP workloads isolated in this namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
