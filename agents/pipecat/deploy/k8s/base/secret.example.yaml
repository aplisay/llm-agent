# TEMPLATE — do NOT apply as-is and do NOT commit real values.
#
# Copy to secret.yaml, fill in real values, and create the Secret out-of-band:
#
#   cp secret.example.yaml secret.yaml      # then edit
#   kubectl apply -n pipecat -f secret.yaml
#
# Or generate the per-stack tokens with `openssl rand -hex 32`. For production,
# prefer a managed backend (sealed-secrets, SOPS, External Secrets Operator) and
# do not keep plaintext secrets in git. On GKE the worker can also pull provider
# keys from Secret Manager via GOOGLE_SECRETENV_PATH (see README).
#
# This template is intentionally NOT listed in base/kustomization.yaml, so the
# pods fail closed (CreateContainerConfigError) until you create the real Secret.
apiVersion: v1
kind: Secret
metadata:
  name: pipecat-secrets
  namespace: pipecat
  labels:
    app.kubernetes.io/name: pipecat-agent
type: Opaque
stringData:
  # ---- shared (all gateways) — must match the llm-agent server side -------
  PIPECAT_DISPATCH_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"
  PIPECAT_JOIN_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  SHARED_API_TOKEN: "REPLACE_WITH_x_shared_token_value"

  # ---- sipbridge ---------------------------------------------------------
  SIPBRIDGE_API_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"

  # ---- FreeSWITCH --------------------------------------------------------
  ESL_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  CALL_API_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"
  WORKER_EVENT_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"
  ESL_POLLER_TOKEN: "REPLACE_WITH_same_as_CALL_API_TOKEN"

  # ---- Voiceblender ------------------------------------------------------
  VOICEBLENDER_API_KEY: "REPLACE_WITH_openssl_rand_hex_32"

  # ---- model / provider API keys (leave blank to omit) -------------------
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  CARTESIA_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  ULTRAVOX_API_KEY: ""
