# Base for the Pipecat agent Kubernetes deploy.
#
# This base is gateway-agnostic and is NOT meant to be applied directly — pick a
# gateway overlay (overlays/sipbridge is the default) and, if you want per-cloud
# load-balancer annotations, layer in a cloud component (components/cloud-*).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pipecat

resources:
  - namespace.yaml
  - configmap.yaml
  - daemonset.yaml
  - service-sip.yaml
  - service-worker.yaml
  # NOTE: secret.example.yaml / sip-tls-secret.example.yaml are intentionally
  # NOT listed — create the real Secrets out-of-band (see README) so pods fail
  # closed until secrets exist rather than running with placeholders.

# detect-external-ip.sh is shipped as a real, testable file and mounted into the
# detect-ip initContainer via this generated ConfigMap. The name-suffix hash
# means editing the script triggers a DaemonSet rollout automatically.
configMapGenerator:
  - name: pipecat-scripts
    files:
      - scripts/detect-external-ip.sh

# Pin image tags here (or override per overlay / via `kustomize edit set image`).
# These default to the Artifact Registry repo that deploy/gcp/cloudbuild*.yaml
# pushes to. Non-GKE clusters need an imagePullSecret for AR (see README).
images:
  - name: europe-west1-docker.pkg.dev/llm-voice/containers/aplisay-pipecat-agent/pipecat-worker
    newTag: latest
  - name: europe-west1-docker.pkg.dev/llm-voice/containers/aplisay-pipecat-agent/sipbridge
    newTag: latest
  - name: europe-west1-docker.pkg.dev/llm-voice/containers/aplisay-pipecat-agent/freeswitch
    newTag: latest
  - name: europe-west1-docker.pkg.dev/llm-voice/containers/aplisay-pipecat-agent/esl-poller
    newTag: latest
  - name: europe-west1-docker.pkg.dev/llm-voice/containers/aplisay-pipecat-agent/secretenv-exec
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: aplisay
      app.kubernetes.io/managed-by: kustomize
