# OPTIONAL TEMPLATE — a real TLS keypair for the SIP TLS listener on 5061.
#
# If you skip this, the gateways fall back to a self-signed certificate
# (sipbridge mints one at startup; FreeSWITCH ships a baked-in self-signed
# pair). That is fine when your SBC is configured to skip cert validation.
# For a CA-signed cert, create the Secret from your PEM files:
#
#   kubectl create secret tls pipecat-sip-tls -n pipecat \
#       --cert=path/to/fullchain.pem --key=path/to/privkey.pem
#
# The DaemonSet mounts this Secret optionally at /etc/sip-tls; sipbridge and
# FreeSWITCH pick it up (set SIPBRIDGE_TLS_CERT_FILE/KEY_FILE in the sipbridge
# overlay to point at it — see overlays/sipbridge).
apiVersion: v1
kind: Secret
metadata:
  name: pipecat-sip-tls
  namespace: pipecat
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE
    -----END PRIVATE KEY-----
