# DigitalOcean production deploy target for the SIP gateway.
#
# = sipbridge gateway (default, TLS-only) + DigitalOcean LB settings (TCP mode) +
# env-production (flip every image :next -> :latest) + a stable load-balancer name
# so the DO-assigned IP persists.
#
# The only differences from do-staging/ are the env-production component and the
# distinct LB name (so staging and production never reconcile the same LB).
#
#     kubectl apply -k do-production
#
# After the first apply, read the stable IP and wire DNS/SBC to it; never delete
# the Service:
#
#     kubectl get svc pipecat-sip -n pipecat -o wide   # EXTERNAL-IP = the stable IP
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../overlays/sipbridge

components:
  - ../components/env-production
  - ../components/cloud-digitalocean
  - ../components/webrtc-do        # adds 443 -> :8082 (WebRTC) on the SAME LB

patches:
  - target:
      kind: Service
      name: pipecat-sip
    patch: |-
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1do-loadbalancer-name
        value: pipecat-sip-production
      # WebRTC TLS — DO-managed Let's Encrypt cert for production.pipecat.aplisay.net:
      #   doctl compute certificate create --type lets_encrypt \
      #     --name pipecat-production --dns-names production.pipecat.aplisay.net
      # Paste its ID below. MUST be a real cert ID before `kubectl apply`.
      # (Remove this op + the webrtc-do component to deploy SIP-only.)
      #
      # GOTCHA: DO mints a NEW certificate ID on every Let's Encrypt auto-renewal
      # (~90 days). The CCM keeps the LIVE Service annotation current, but this
      # pinned copy goes stale — and the DO admission webhook then rejects the
      # whole apply (even --dry-run=server) with "certificate not found". Before
      # applying, refresh the value from the live object:
      #   kubectl -n pipecat get svc pipecat-sip -o jsonpath=\
      #     '{.metadata.annotations.service\.beta\.kubernetes\.io/do-loadbalancer-certificate-id}'
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1do-loadbalancer-certificate-id
        value: 2119c655-7cdd-4b5b-84a1-d9be184323a1
