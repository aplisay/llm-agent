# WebRTC on the EXISTING SIP load balancer (DigitalOcean).
#
# Rather than a second LB, this extends the `pipecat-sip` Service (the LB that
# already fronts TCP 5061) with a TLS-terminated 443 -> worker :8082 port. DO
# supports a mix on one LB: 5061 stays TCP passthrough (the gateway does its own
# SIP TLS), 443 terminates with a cert and forwards plain HTTP to the worker. The
# LB keeps its IP (it's the same Service / do-loadbalancer-name).
#
# Browsers POST /webrtc/offer to https://<fqdn>/ ; an off-cluster llm-agent POSTs
# /dispatch there too. Sessions are pod-local: the offer and its follow-up PATCH
# /webrtc/offer (trickle ICE) must reach the pod that owns the session — any
# other pod 404s them. With 2 SIP nodes and no affinity we observed exactly
# that: intermittent 404s on offer/PATCH, browser connects wedging, and one-way
# media. sessionAffinity: ClientIP restored reliable connects (verified
# empirically; SIP on 5061 is unaffected — each TLS dialog is one connection).
# A durable fix is routing by the session token (or shared session state) so
# any pod can serve any client; until then this narrows the failure window.
#
# Layer AFTER cloud-digitalocean (which creates the annotations object), then set
# the per-env cert ID + LB name in the overlay:
#
#     components:
#       - ../components/cloud-digitalocean
#       - ../components/webrtc-do
#     patches: [ ... do-loadbalancer-certificate-id: <DO cert ID>, ... ]
#
# Prerequisites (see README "WebRTC"): a DO-managed Let's Encrypt cert for the
# FQDN (pipecat.aplisay.net is delegated to DO, so `doctl compute certificate
# create --type lets_encrypt --dns-names <fqdn>` issues + auto-renews it) — put
# its ID in the overlay; a DNS A record -> the LB IP; a DO firewall opening the
# WebRTC media UDP range to browsers; PIPECAT_PUBLIC_URL + PIPECAT_WORKER_URL on
# the llm-agent side.
#
# Surface note: this exposes ALL worker routes on :8082, not just /webrtc/offer +
# /dispatch (they're token-gated; /daily/dialin is unauthenticated but no-ops off
# a Daily gateway). To expose only the two paths, front with an Ingress instead.
#
# Other clouds (GKE/EKS): use an Ingress controller + cert-manager.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Service
      name: pipecat-sip
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: webrtc-https
          port: 443
          targetPort: 8082
          protocol: TCP
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1do-loadbalancer-tls-ports
        value: "443"
      - op: add
        path: /spec/sessionAffinity
        value: ClientIP

  # Disable STUN on DigitalOcean. DO puts the droplet's public IP directly on the
  # NIC, so the worker's *host* ICE candidate is already browser-reachable — a
  # server-reflexive (STUN) candidate is redundant here (it resolves to the same
  # public IP). Worse: the worker runs on hostNetwork on a multi-homed node (DO
  # private + k8s overlay NICs), and aiortc probes STUN out of *every* interface;
  # the unroutable ones stall ICE gathering to aioice's ~5s cap, delaying the SDP
  # answer — and thus browser connect — by ~5s on every call. Empty = host-only
  # gather, which completes instantly. KEEP STUN on 1:1-NAT clouds (GCP/AWS),
  # where the public IP is off the NIC and only STUN can discover it.
  - target:
      kind: ConfigMap
      name: pipecat-config
    patch: |-
      - op: replace
        path: /data/WEBRTC_ICE_SERVERS
        value: ""
