# EXAMPLE — automated Let's Encrypt renewal for the DO LB's WebRTC cert.
#
# DNS for *.pipecat.aplisay.net is on Google Cloud DNS, so DNS-01 can be fully
# automated. This CronJob (monthly) re-issues the LE cert with `lego` (gcloud
# provider), uploads it to DO as a new custom cert, repoints the pipecat-sip
# Service's `do-loadbalancer-certificate-id` annotation at it (the DO CCM then
# rolls the live LB), and prunes the old certs.
#
# NOT applied by default (it's an .example with placeholders + its own Secrets).
# Adapt per environment (staging shown). Prereqs:
#   - Secret gcp-dns-sa: a GCP service-account key.json with roles/dns.admin on
#     the Cloud DNS zone for aplisay.net.
#   - Secret do-api: a DigitalOcean API token (cert create/delete + the CCM).
#
# ⚠️ Drift: once this CronJob owns the cert-id annotation, REMOVE the hardcoded
#    `do-loadbalancer-certificate-id` op from do-staging/kustomization.yaml — else
#    a later `kubectl apply -k do-staging` reverts the LB to a now-deleted cert ID
#    and breaks 443. Bootstrap the first cert by setting it once (manually or by
#    running this Job once), then let the CronJob keep it current.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipecat-cert-rotator
  namespace: pipecat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipecat-cert-rotator
  namespace: pipecat
rules:
  # Only needs to patch the one Service's annotations.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipecat-cert-rotator
  namespace: pipecat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipecat-cert-rotator
subjects:
  - kind: ServiceAccount
    name: pipecat-cert-rotator
    namespace: pipecat
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipecat-cert-renew
  namespace: pipecat
spec:
  schedule: "17 3 1 * *"          # 03:17 on the 1st of each month (LE certs last ~90d)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: pipecat-cert-rotator
          restartPolicy: Never
          containers:
            - name: rotate
              image: alpine:3.20
              env:
                - name: FQDN
                  value: staging.pipecat.aplisay.net
                - name: ENVN
                  value: staging               # cert name prefix: pipecat-staging-*
                - name: NS
                  value: pipecat
                - name: ACME_EMAIL
                  value: ops@aplisay.net
                - name: GCE_PROJECT
                  value: REPLACE_WITH_GCP_PROJECT_ID   # the Cloud DNS project
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /gcp/key.json
                - name: DIGITALOCEAN_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef: { name: do-api, key: token }
                - name: LEGO_VERSION
                  value: "4.18.0"
                - name: DOCTL_VERSION
                  value: "1.115.0"
                - name: KUBECTL_VERSION
                  value: "1.32.0"
              volumeMounts:
                - { name: gcp-dns-sa, mountPath: /gcp, readOnly: true }
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  apk add --no-cache curl ca-certificates >/dev/null
                  cd /tmp
                  curl -fsSL "https://github.com/go-acme/lego/releases/download/v${LEGO_VERSION}/lego_v${LEGO_VERSION}_linux_amd64.tar.gz" | tar xz lego
                  curl -fsSL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" | tar xz doctl
                  curl -fsSL -o kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && chmod +x kubectl
                  export PATH="/tmp:$PATH"

                  # 1. Issue a fresh LE cert via Cloud DNS DNS-01 (re-issue monthly
                  #    is well within LE rate limits; no PVC/account persistence).
                  lego --accept-tos --email "$ACME_EMAIL" --dns gcloud \
                       --domains "$FQDN" --path /tmp/lego run

                  C=/tmp/lego/certificates
                  # leaf = first PEM block of the fullchain; chain = issuer cert.
                  awk 'BEGIN{n=0} /BEGIN CERT/{n++} n==1{print} /END CERT/{if(n==1)exit}' \
                      "$C/$FQDN.crt" > /tmp/leaf.pem

                  # 2. Upload as a new DO custom cert; capture its ID.
                  NEW_ID=$(doctl compute certificate create --type custom \
                      --name "pipecat-${ENVN}-$(date +%Y%m%d%H%M)" \
                      --leaf-certificate-path  /tmp/leaf.pem \
                      --certificate-chain-path "$C/$FQDN.issuer.crt" \
                      --private-key-path       "$C/$FQDN.key" \
                      --format ID --no-header)
                  echo "new cert: $NEW_ID"

                  # 3. Repoint the Service annotation -> CCM rolls the live LB.
                  kubectl annotate -n "$NS" service pipecat-sip --overwrite \
                      service.beta.kubernetes.io/do-loadbalancer-certificate-id="$NEW_ID"

                  # 4. Let the CCM swap the LB cert, then prune older certs.
                  sleep 90
                  doctl compute certificate list --format ID,Name --no-header \
                    | awk -v p="pipecat-${ENVN}-" '$2 ~ "^"p {print $1}' \
                    | while read -r id; do
                        [ "$id" = "$NEW_ID" ] || doctl compute certificate delete -f "$id" || true
                      done
          volumes:
            - name: gcp-dns-sa
              secret:
                secretName: gcp-dns-sa     # key.json with roles/dns.admin
