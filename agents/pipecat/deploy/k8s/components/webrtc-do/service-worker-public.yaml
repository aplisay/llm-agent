# Public, TLS-terminated entry point for the worker's HTTP API on :8082 — the
# endpoint browsers hit for WebRTC (`POST /webrtc/offer`) and the endpoint the
# llm-agent server hits for `/dispatch` if it runs outside the cluster.
#
# This is SEPARATE from pipecat-sip (which is TCP 5061 SIP passthrough). Here a
# DigitalOcean LoadBalancer terminates HTTPS on 443 and forwards plain HTTP to
# the worker's :8082 (the worker is plain uvicorn; TLS lives at the LB).
#
# The browser offer is self-contained from the join token (no pre-dispatch
# state), so any worker node can answer any offer — externalTrafficPolicy:
# Cluster is fine, and the WebRTC media then flows to whichever node answered.
#
# Point the llm-agent server's PIPECAT_PUBLIC_URL (and PIPECAT_WORKER_URL, if the
# server is external) at https://<this LB's hostname>.
apiVersion: v1
kind: Service
metadata:
  name: pipecat-worker-public
  namespace: pipecat
  labels:
    app.kubernetes.io/name: pipecat-agent
    app.kubernetes.io/component: sip-node
  annotations:
    # DO LB: terminate TLS on 443, forward HTTP to :8082. DNS is external (not
    # DO), so DO's *managed* Let's Encrypt cert can't validate — instead upload
    # an externally-issued LE cert (free, per-host — no wildcard) as a CUSTOM
    # cert and reference its ID:
    #   certbot/lego (DNS-01) -> fullchain.pem + privkey.pem
    #   doctl compute certificate create --type custom --name pipecat-worker \
    #     --certificate-path fullchain.pem --private-key-path privkey.pem
    #   doctl compute certificate list   # -> put the ID below
    # (Or use cert-manager + an Ingress instead of this LB — see the README.)
    service.beta.kubernetes.io/do-loadbalancer-protocol: "https"
    service.beta.kubernetes.io/do-loadbalancer-tls-ports: "443"
    service.beta.kubernetes.io/do-loadbalancer-certificate-id: "REPLACE_WITH_DO_CERTIFICATE_ID"
    service.beta.kubernetes.io/do-loadbalancer-redirect-http-to-https: "true"
    # The worker has no GET health route (only POST endpoints), so a default
    # HTTP health check would mark every node down. Use a TCP check.
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "tcp"
    # Stable LB name so the DO IP persists across Service recreation.
    service.beta.kubernetes.io/do-loadbalancer-name: "pipecat-worker"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: pipecat-agent
    app.kubernetes.io/component: sip-node
  ports:
    - name: https
      port: 443
      targetPort: 8082
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8082
      protocol: TCP
