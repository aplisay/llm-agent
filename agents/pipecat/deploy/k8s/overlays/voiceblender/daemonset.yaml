# Adds the voiceblender SIP/media engine to the per-node pod and points the
# worker at the voiceblender gateway.
#
# voiceblender's settings are its own (unprefixed) variables, in the
# voiceblender-config ConfigMap. scripts/start.sh adds the addresses of the
# node and refuses to start an engine that any address could use.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pipecat-sip
  namespace: pipecat
spec:
  template:
    spec:
      initContainers:
        # voiceblender will not start its TLS listener without a certificate
        # and cannot make one. This makes a self-signed pair, which start.sh
        # uses when the pipecat-sip-tls Secret is absent.
        - name: make-sip-cert
          image: europe-west1-docker.pkg.dev/llm-voice/containers/llm-agent/pipecat-worker:latest
          command: ["uv", "run", "--no-sync", "python", "-m", "pipecat_aplisay.selfsigned", "/etc/node-meta/sip-tls"]
          volumeMounts:
            - name: node-meta
              mountPath: /etc/node-meta

      containers:
        - name: pipecat-worker
          env:
            - name: SIP_GATEWAY
              value: voiceblender
            # voiceblender's API listens on the node's private address, not on
            # loopback, so this replaces the URL in pipecat-config.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VOICEBLENDER_BASE_URL
              value: "http://$(HOST_IP):8080"
          # As the base hook, and it first tells the worker to refuse calls
          # that call control hands over (VOICEBLENDER_INBOUND=dispatch).
          lifecycle:
            preStop:
              exec:
                command: ["python", "-m", "pipecat_aplisay.drain"]

        - name: voiceblender
          # Pinned in four places: here, agents/pipecat/docker-compose*.yml and
          # deploy/gcp/docker-compose.gcp.yml. Change them together.
          image: vpbx/voiceblender:0.16.0
          # secretenv-exec decrypts SECRETENV_BUNDLE into the env (voiceblender
          # can't decrypt natively) and is a no-op when it is unset. The static
          # busybox then runs start.sh, which execs voiceblender from PATH.
          command: ["/etc/node-meta/secretenv-exec", "/etc/node-meta/busybox", "sh", "/opt/voiceblender-scripts/start.sh"]
          envFrom:
            - configMapRef:
                name: voiceblender-config
            - secretRef:
                name: pipecat-secretenv
                optional: true
          env:
            # The node's private address on the clouds this is used on.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PIPECAT_SIP_FROM_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: pipecat-config
                  key: PIPECAT_SIP_FROM_DOMAIN
          # Informational under hostNetwork.
          ports:
            - name: vb-http
              containerPort: 8080
              protocol: TCP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tls
              containerPort: 5061
              protocol: TCP
          # No liveness probe, on purpose: a restart cuts every call.
          readinessProbe:
            httpGet:
              path: /v1/legs
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          # Kubernetes runs preStop per container and sends each its SIGTERM
          # when its own hook returns. Without this, voiceblender would hang
          # every call up while the worker was still waiting for them to end.
          lifecycle:
            preStop:
              exec:
                command: ["/etc/node-meta/busybox", "sh", "/opt/voiceblender-scripts/wait-for-calls.sh"]
          volumeMounts:
            - name: node-meta
              mountPath: /etc/node-meta
            - name: voiceblender-scripts
              mountPath: /opt/voiceblender-scripts
              readOnly: true
            - name: sip-tls
              mountPath: /etc/sip-tls
              readOnly: true
            # voiceblender's recording and cache directories.
            - name: voiceblender-tmp
              mountPath: /tmp
          # No CPU limit: a throttled engine adds delay to every call on it.
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: voiceblender-scripts
          configMap:
            name: voiceblender-scripts
            defaultMode: 0755
        - name: voiceblender-tmp
          emptyDir: {}
