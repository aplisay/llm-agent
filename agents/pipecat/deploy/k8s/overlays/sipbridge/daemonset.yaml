# Adds the sipbridge SIP/media container to the per-node pod and tells the
# worker to instantiate the sipbridge gateway.
#
# sipbridge ships as a distroless image with no shell, so it cannot expand the
# detected node IP itself. We launch it through the static busybox the
# install-shim initContainer dropped into the shared volume: a 3-line wrapper
# exports the advertised SIP + media IP (read from /etc/node-meta/ext-ip) and
# then execs the real binary. Everything else comes from envFrom.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pipecat-sip
  namespace: pipecat
spec:
  template:
    spec:
      containers:
        - name: pipecat-worker
          env:
            - name: SIP_GATEWAY
              value: sipbridge

        - name: sipbridge
          # :next = staging default; components/env-production overrides to :latest.
          image: europe-west1-docker.pkg.dev/llm-voice/containers/llm-agent/sipbridge:next
          # MUST be Always, like pipecat-worker above: the tag is mutable, so
          # with the k8s default (IfNotPresent for a tagged image) a rollout
          # restart reuses whatever ``:next`` layer each node already cached.
          # That is silent — the DaemonSet reports updated 2/2 and the pods do
          # restart, but the binary never changes, and nodes drift onto
          # DIFFERENT builds of the same tag (seen 2026-08-11: two nodes on two
          # sipbridge digests, so the same call behaved differently per leg).
          imagePullPolicy: Always
          command: ["/etc/node-meta/busybox", "sh", "-c"]
          args:
            - |
              export SIPBRIDGE_SIP_SIGNAL_IP="$(/etc/node-meta/busybox cat /etc/node-meta/ext-ip)"
              export SIPBRIDGE_MEDIA_IP="$SIPBRIDGE_SIP_SIGNAL_IP"
              exec /sipbridge
          # sipbridge decrypts SECRETENV_BUNDLE natively at startup, so the
          # secret sources are both optional (use pipecat-secrets, the bundle,
          # or both — bundle wins).
          envFrom:
            - configMapRef:
                name: pipecat-config
            - secretRef:
                name: pipecat-secrets
                optional: true
            - secretRef:
                name: pipecat-secretenv
                optional: true
          # To use a CA-signed cert instead of the self-signed fallback, create
          # the pipecat-sip-tls Secret (see base/sip-tls-secret.example.yaml) and
          # uncomment:
          # env:
          #   - name: SIPBRIDGE_TLS_CERT_FILE
          #     value: /etc/sip-tls/tls.crt
          #   - name: SIPBRIDGE_TLS_KEY_FILE
          #     value: /etc/sip-tls/tls.key
          ports:
            - name: sip-tls
              containerPort: 5061
              protocol: TCP
            - name: sip-api
              containerPort: 8090
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          # Drain in step with the worker. Kubernetes runs preStop
          # PER CONTAINER and sends each its SIGTERM as soon as ITS OWN
          # hook returns — so without this, sipbridge would take SIGTERM
          # (and BYE every live dialog) while the worker was still
          # waiting for those very calls to finish.
          #
          # Polls its own /health until active_calls hits zero, using the
          # busybox shim: the image is distroless and has no shell or
          # HTTP client of its own. The ceiling is a little under the
          # worker's so the worker is still the one that decides when the
          # node is empty; sipbridge's own SIGTERM handler then does the
          # real drain (refuse new INVITEs with 503 + Retry-After, BYE
          # anything still up).
          lifecycle:
            preStop:
              exec:
                command:
                  - /etc/node-meta/busybox
                  - sh
                  - -c
                  - |
                    i=0
                    max="${LIFECYCLE_DRAIN_SECONDS:-1200}"
                    max=$((max / 5))
                    while [ "$i" -lt "$max" ]; do
                      body=$(/etc/node-meta/busybox wget -q -T 3 -O - \
                        http://127.0.0.1:8090/health 2>/dev/null) || break
                      case "$body" in
                        *'"active_calls":0'*) break ;;
                      esac
                      /etc/node-meta/busybox sleep 5
                      i=$((i + 1))
                    done
          volumeMounts:
            - name: node-meta
              mountPath: /etc/node-meta
            - name: sip-tls
              mountPath: /etc/sip-tls
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
