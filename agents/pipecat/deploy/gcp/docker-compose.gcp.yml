# Production / staging compose for the Pipecat agent stack on a GCP VM.
#
# Pulls pre-built images from Artifact Registry. The local-dev compose at
# agents/pipecat/docker-compose.yml builds the same services from source.
#
# Expected to live on the VM at ~/pipecat-agent/docker-compose.yaml alongside
# a .env file populated by deploy-node.sh from env-example-{staging,production}.
#
# Compose profiles select the SIP ingress; only one ingress runs at a time
# because they share the host's UDP/5060 + RTP port ranges:
#
#     docker compose --profile freeswitch up -d
#     docker compose --profile voiceblender up -d
#     docker compose --profile sipbridge up -d
#     docker compose --profile daily up -d        # no SIP host container
#
# `.env` controls which one deploy-node.sh starts via the SIP_GATEWAY +
# COMPOSE_PROFILES variables.
services:
  # ---- FreeSWITCH ingress (profile: freeswitch) -------------------------

  freeswitch:
    profiles: ["freeswitch"]
    image: ${IMAGE_REGISTRY}/${PROJECT_ID}/containers/${REPO_NAME}/freeswitch:${IMAGE_TAG:-staging}
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      EXT_IP_ADDRESS: ${EXT_IP_ADDRESS:-127.0.0.1}
      ESL_SECRET: ${ESL_SECRET}
      PIPECAT_WS_URL: ${PIPECAT_WS_URL:-ws://127.0.0.1:8082/freeswitch/audio}
      # Default-SBC next hop. entrypoint.sh derives PIPECAT_SBC_PROXY (scheme-
      # stripped) from PIPECAT_SIP_OUTBOUND; vars.xml pulls the full quartet
      # into FreeSWITCH globals (the static sip_profiles/external.xml gateway).
      PIPECAT_SIP_OUTBOUND: ${PIPECAT_SIP_OUTBOUND:-}
      PIPECAT_SIP_USERNAME: ${PIPECAT_SIP_USERNAME:-}
      PIPECAT_SIP_PASSWORD: ${PIPECAT_SIP_PASSWORD:-}
      PIPECAT_SIP_FROM_DOMAIN: ${PIPECAT_SIP_FROM_DOMAIN:-}

  esl-poller:
    profiles: ["freeswitch"]
    image: ${IMAGE_REGISTRY}/${PROJECT_ID}/containers/${REPO_NAME}/esl-poller:${IMAGE_TAG:-staging}
    network_mode: host
    restart: always
    depends_on:
      freeswitch:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ESL_HOST: 127.0.0.1
      ESL_PORT: 8021
      ESL_SECRET: ${ESL_SECRET}
      CALL_API_PORT: 4001
      CALL_API_TOKEN: ${CALL_API_TOKEN}
      WORKER_EVENT_WEBHOOK: ${WORKER_EVENT_WEBHOOK:-http://127.0.0.1:8082/freeswitch/events}
      WORKER_EVENT_TOKEN: ${WORKER_EVENT_TOKEN:-${CALL_API_TOKEN}}
      GATEWAY_POLL_ENABLED: "false"
      CALL_API_ENABLED: "true"
      # Outbound originates run uuid_audio_stream toward this WS and (for b2bua
      # targets) stamp this From domain. Same values FS uses.
      PIPECAT_WS_URL: ${PIPECAT_WS_URL:-ws://127.0.0.1:8082/freeswitch/audio}
      PIPECAT_SIP_FROM_DOMAIN: ${PIPECAT_SIP_FROM_DOMAIN:-}

  # ---- Voiceblender ingress (profile: voiceblender) ---------------------

  voiceblender:
    profiles: ["voiceblender"]
    image: ghcr.io/voiceblender/voiceblender:${VOICEBLENDER_VERSION:-v0.7.1}
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":${VOICEBLENDER_HTTP_PORT:-8080}"
      SIP_PORT: ${VOICEBLENDER_SIP_PORT:-5060}
      SIP_TLS_PORT: ${VOICEBLENDER_SIP_TLS_PORT:-0}
      RTP_PORT_MIN: ${VOICEBLENDER_RTP_PORT_MIN:-10000}
      RTP_PORT_MAX: ${VOICEBLENDER_RTP_PORT_MAX:-20000}
      EXT_IP_ADDRESS: ${EXT_IP_ADDRESS:-127.0.0.1}
      API_KEY: ${VOICEBLENDER_API_KEY:-}

  # ---- sipbridge ingress (profile: sipbridge) ---------------------------

  sipbridge:
    profiles: ["sipbridge"]
    image: ${IMAGE_REGISTRY}/${PROJECT_ID}/containers/${REPO_NAME}/sipbridge:${IMAGE_TAG:-staging}
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      SIPBRIDGE_SIP_SIGNAL_IP: ${EXT_IP_ADDRESS:-127.0.0.1}
      SIPBRIDGE_SIP_SIGNAL_PORT: ${SIPBRIDGE_SIP_PORT:-5060}
      SIPBRIDGE_MEDIA_IP: ${EXT_IP_ADDRESS:-127.0.0.1}
      SIPBRIDGE_RTP_PORT_MIN: ${SIPBRIDGE_RTP_PORT_MIN:-10000}
      SIPBRIDGE_RTP_PORT_MAX: ${SIPBRIDGE_RTP_PORT_MAX:-20000}
      SIPBRIDGE_WORKER_WS_BASE: ${SIPBRIDGE_WORKER_WS_BASE:-ws://127.0.0.1:8082}
      SIPBRIDGE_API_BIND_ADDR: ":${SIPBRIDGE_API_PORT:-8090}"
      SIPBRIDGE_API_TOKEN: ${SIPBRIDGE_API_TOKEN:-}
      # Outbound-trunk identity + auth (read by the Go bridge). FROM_DOMAIN must
      # equal the SBC's PIPECAT_HANDLER_DOMAIN; USERNAME/PASSWORD must match the
      # SBC subscriber row in that realm.
      PIPECAT_SIP_FROM_DOMAIN: ${PIPECAT_SIP_FROM_DOMAIN:-}
      PIPECAT_SIP_USERNAME: ${PIPECAT_SIP_USERNAME:-}
      PIPECAT_SIP_PASSWORD: ${PIPECAT_SIP_PASSWORD:-}
      # sipbridge decrypts SECRETENV_BUNDLE natively at startup. Either set
      # SECRETENV_KEY / SECRETENV_BUNDLE directly (env_file) or point at Secret
      # Manager via GOOGLE_SECRETENV_PATH.
      SECRETENV_KEY: ${SECRETENV_KEY:-}
      SECRETENV_BUNDLE: ${SECRETENV_BUNDLE:-}
      GOOGLE_SECRETENV_PATH: ${GOOGLE_SECRETENV_PATH:-}
      SIPBRIDGE_LOG_LEVEL: ${LOGLEVEL:-info}

  # ---- Pipecat worker (all profiles) ------------------------------------

  pipecat-worker:
    profiles: ["freeswitch", "voiceblender", "sipbridge", "daily"]
    image: ${IMAGE_REGISTRY}/${PROJECT_ID}/containers/${REPO_NAME}/pipecat-worker:${IMAGE_TAG:-staging}
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      PORT: 8082
      # Selects which gateway to instantiate at startup.
      SIP_GATEWAY: ${SIP_GATEWAY:-freeswitch}

      # FreeSWITCH-only:
      ESL_POLLER_URL: ${ESL_POLLER_URL:-http://127.0.0.1:4001}
      ESL_POLLER_TOKEN: ${CALL_API_TOKEN}
      WORKER_EVENT_TOKEN: ${WORKER_EVENT_TOKEN:-${CALL_API_TOKEN}}

      # Voiceblender-only:
      VOICEBLENDER_BASE_URL: ${VOICEBLENDER_BASE_URL:-http://127.0.0.1:8080}
      VOICEBLENDER_API_KEY: ${VOICEBLENDER_API_KEY:-}
      VOICEBLENDER_APP_ID: ${VOICEBLENDER_APP_ID:-aplisay-pipecat}
      VOICEBLENDER_WORKER_WS_BASE: ${VOICEBLENDER_WORKER_WS_BASE:-ws://127.0.0.1:8082}

      # sipbridge-only:
      SIPBRIDGE_BASE_URL: ${SIPBRIDGE_BASE_URL:-http://127.0.0.1:8090}
      SIPBRIDGE_API_TOKEN: ${SIPBRIDGE_API_TOKEN:-}

      # All profiles:
      SERVICE_BASE_URI: ${SERVICE_BASE_URI}
      SHARED_API_TOKEN: ${SHARED_API_TOKEN}
      PIPECAT_DISPATCH_TOKEN: ${PIPECAT_DISPATCH_TOKEN}
      PIPECAT_JOIN_SECRET: ${PIPECAT_JOIN_SECRET}
      # Outbound trunk — also read by the worker (e.g. for transfer routing).
      PIPECAT_SIP_OUTBOUND: ${PIPECAT_SIP_OUTBOUND:-}
      PIPECAT_SIP_FROM_DOMAIN: ${PIPECAT_SIP_FROM_DOMAIN:-}
      PIPECAT_SIP_USERNAME: ${PIPECAT_SIP_USERNAME:-}
      PIPECAT_SIP_PASSWORD: ${PIPECAT_SIP_PASSWORD:-}
      # The worker decrypts SECRETENV_BUNDLE into its env at startup. Either set
      # the pair directly (env_file) or have the worker fetch from Secret
      # Manager via GOOGLE_SECRETENV_PATH (the VM's cloud-platform OAuth scope).
      SECRETENV_KEY: ${SECRETENV_KEY:-}
      SECRETENV_BUNDLE: ${SECRETENV_BUNDLE:-}
      GOOGLE_SECRETENV_PATH: ${GOOGLE_SECRETENV_PATH:-}
      VOICEBLENDER_VSI_TOKEN: ${VOICEBLENDER_VSI_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ULTRAVOX_API_KEY: ${ULTRAVOX_API_KEY:-}
      LOGLEVEL: ${LOGLEVEL:-info}
