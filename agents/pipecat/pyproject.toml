[project]
name = "pipecat-aplisay-agent"
version = "0.1.0"
description = "Aplisay voice agent worker built on Pipecat. Daily as a pure SIP gateway, SmallWebRTCTransport for browsers."
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,cartesia,daily,deepgram,google,mcp,openai,silero,ultravox,webrtc]==1.10.0",
    # We import mcp directly (pipecat_aplisay/mcp_tools.py), so declare it. The
    # 2 floor is deliberate: mcp 2 renamed the transport and moved the model
    # attributes to snake_case, and mcp_tools.py now speaks only that dialect.
    "mcp[cli]>=2,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "google-cloud-storage>=2.14",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipecat_aplisay"]
