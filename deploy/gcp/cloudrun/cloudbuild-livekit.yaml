# Cloud Build — livekit-agent (per-commit build).
#
# Runs on every commit to main. Builds and pushes the image tagged with the
# commit SHA only — it does NOT tag :latest. Promotion to :latest / :$TAG_NAME
# happens as a group at release time via the top-level cloudbuild-release.yaml
# (triggered by a version tag). livekit-agent runs as a docker-compose container
# on GCE that pulls :latest, so the release :latest promotion + a manual restart
# is its deploy path.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--no-cache'
      - '--build-arg'
      - SECRETENV_BUNDLE
      - '--build-arg'
      - SECRETENV_KEY
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - '-f'
      - agents/livekit/Dockerfile
      - .
    id: Build
    secretEnv:
      - SECRETENV_BUNDLE
      - SECRETENV_KEY
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
images:
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
  automapSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SERVICE_NAME: livekit-agent
  _DEPLOY_REGION: $LOCATION
  _AR_HOSTNAME: $LOCATION-docker.pkg.dev
tags:
  - livekit-agent
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SECRETENV_BUNDLE/versions/latest
      env: SECRETENV_BUNDLE
    - versionName: projects/$PROJECT_ID/secrets/SECRETENV_KEY/versions/latest
      env: SECRETENV_KEY
