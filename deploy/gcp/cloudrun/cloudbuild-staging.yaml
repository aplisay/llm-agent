# Staging build for llm-agent: run the DB test suite, build the image, deploy.
#
# Step layout. `Test` and `Build` both start immediately and run in parallel;
# `Push` waits for both, so nothing reaches the registry or Cloud Run unless
# the suite passed. Build no longer sits idle behind the test run.
#
# Caching. Both steps build from the same Dockerfile, whose `deps` stage holds
# the whole dependency tree and reads no build arg. `--cache-from` points at
# the last pushed staging image, which carries inline cache metadata
# (BUILDKIT_INLINE_CACHE=1 below), so `yarn install` is a cache hit whenever
# package.json and yarn.lock are unchanged, and Push re-uses the node_modules
# layer already in the registry instead of uploading it again. A lockfile
# change is part of the cache key, so it still forces a real install.
#
# The first build after this config lands is a full miss: the current :staging
# image was built with --no-cache and carries no cache metadata. It seeds the
# cache for the next one.
steps:
  - name: gcr.io/cloud-builders/docker
    id: Test
    waitFor: ['-']
    env:
      - >-
        CACHE_IMAGE=$_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:staging
    args:
      - compose
      - '-f'
      - 'docker-compose.ci.yml'
      - 'up'
      - '--abort-on-container-exit'
      - '--exit-code-from'
      - 'test-runner'
    secretEnv:
      - SECRETENV_BUNDLE
      - SECRETENV_KEY
  - name: gcr.io/cloud-builders/docker
    id: Test-Cleanup
    waitFor: ['Test']
    args:
      - compose
      - '-f'
      - 'docker-compose.ci.yml'
      - 'down'
      - '-v'
  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ['-']
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - '--target=runtime'
      - '--cache-from'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:staging
      - '--build-arg'
      - BUILDKIT_INLINE_CACHE=1
      - '--build-arg'
      - SECRETENV_BUNDLE
      - '--build-arg'
      - SECRETENV_KEY
      - '--build-arg'
      - COMMIT_SHA=$COMMIT_SHA
      - '--build-arg'
      - BRANCH_NAME=$BRANCH_NAME
      - '--build-arg'
      - TAG_NAME=$TAG_NAME
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:staging
      - .
      - '-f'
      - Dockerfile
    secretEnv:
      - SECRETENV_BUNDLE
      - SECRETENV_KEY
  - name: gcr.io/cloud-builders/docker
    id: Push
    waitFor: ['Test', 'Build']
    args:
      - push
      - '--all-tags'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME
  # gcr.io/cloud-builders/gcloud is cached on the build worker; the cloud-sdk
  # images are not, and pulling one cost this step about 30 seconds a build.
  - name: gcr.io/cloud-builders/gcloud
    id: Deploy
    waitFor: ['Push']
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - >-
        --image=$_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
    entrypoint: gcloud
images:
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/containers/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
  automapSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - $_SERVICE_NAME
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SECRETENV_STAGING_BUNDLE/versions/latest
      env: SECRETENV_BUNDLE
    - versionName: projects/$PROJECT_ID/secrets/SECRETENV_STAGING_KEY/versions/latest
      env: SECRETENV_KEY
