services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: llmvoicetest
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d llmvoicetest"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  test-runner:
    build:
      context: .
      # The `test` target of the main Dockerfile, so the suite runs on the same
      # base and the same node_modules layer as the deployed image.
      dockerfile: Dockerfile
      target: test
      # CI points CACHE_IMAGE at the last pushed runtime image. Its `deps`
      # layer is reused whenever package.json and yarn.lock are unchanged, so
      # the test image does not reinstall the dependency tree on every build.
      # The default is the base image, which carries no cache metadata and is
      # therefore a harmless no-op for a local `yarn test:ci`.
      cache_from:
        - ${CACHE_IMAGE:-node:22}
      args:
        SECRETENV_BUNDLE: ${SECRETENV_BUNDLE}
        SECRETENV_KEY: ${SECRETENV_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USE_CONTAINER_NETWORKING: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: llmvoicetest
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      CREDENTIALS_KEY: test-secret-key-for-comprehensive-tests
      SECRETENV_BUNDLE: ${SECRETENV_BUNDLE}
      SECRETENV_KEY: ${SECRETENV_KEY}
      DB_FORCE_SYNC: "true"
      NODE_ENV: test
      LOGLEVEL: fatal
    networks:
      - test-network
    command: >
      sh -c "
        echo '🚀 Starting all tests...' && \

        echo 'Running all tests with yarn test...' && \
        yarn test && \
        echo '✅ All tests passed!' && \
        exit 0
      "

networks:
  test-network:
    driver: bridge
